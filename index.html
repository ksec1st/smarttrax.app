<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartTrax</title>
<meta name="description" content="スマトラ｜交通費申請をもっとラクに">
<link rel="stylesheet" href="style.css">

</head>
<body>
<!-- ==================================================
     ヘッダー
================================================== -->
<header class="header">
<div class="header-inner"><div>
<div class="logo">SmartTrax</div><div class="subtitle">交通費申請システム"スマトラ"</div></div><button id="logoutButton" class="logout-button hidden">ログアウト</button></div></header>

<main class="container">
<!-- ==================================================
     ログイン
================================================== -->
<section id="loginScreen" class="screen">
<div class="login-wrapper"><div class="card login-card"><h1>ログイン</h1><p class="description">登録されているIDを入力してください。</p><form id="loginForm"><label for="loginId">ID</label><input type="text" id="loginId" placeholder="例：student001" autocomplete="off"required>
<button type="submit" class="primary-button">ログイン</button></form><p id="loginMessage" class="message"></p></div></div>
</section>
<!-- ==================================================
     生徒画面
================================================== -->
<section id="studentScreen" class="screen hidden">
<div class="dashboard-header"><div><p class="eyebrow">STUDENT</p><h1>交通費申請</h1><p id="studentName"></p></div></div>
<!-- 申請フォーム -->
<div class="card"><h2>新しい交通費申請</h2><form id="expenseForm"><div class="form-grid">
<div class="form-group"><label>氏名</label><input type="text" id="name"required></div>
<div class="form-group"><label>学年</label><input type="text" id="grade"readonly></div>
<div class="form-group"><label>クラス</label>
<select id="className" required><option value="">選択してください</option><option value="1組">1組</option><option value="2組">2組</option><option value="3組">3組</option><option value="4組">4組</option><option value="5組">5組</option></select>
</div>
<div class="form-group"><label>遠征日</label>
<input type="date" id="tripDate" required>

        </div>


        <div class="form-group full">

          <label>
            遠征先
          </label>

          <input
            type="text"
            id="destination"
            placeholder="例：大阪府大阪市"
            required>

        </div>


        <div class="form-group full">

          <label>
            大会・イベント名
          </label>

          <input
            type="text"
            id="eventName"
            placeholder="例：○○大会"
            required>

        </div>


        <!-- ==================================================
             経路
        ================================================== -->

        <div class="form-group full">

          <label>
            出発地
          </label>

          <input
            type="text"
            id="departure"
            placeholder="例：京阪宇治駅"
            required>

        </div>


        <div
          id="viaContainer"
          class="form-group full">
        </div>


        <div class="route-actions">

          <button
            type="button"
            id="addViaButton"
            class="secondary-button">

            ＋ 経由地を追加

          </button>

        </div>


        <div class="form-group full">

          <label>
            到着地
          </label>

          <input
            type="text"
            id="arrival"
            placeholder="例：京都駅"
            required>

        </div>


        <!-- 区間料金 -->

        <div class="form-group full">

          <div class="student-note">

            各区間料金は申請時には記録されますが、
            合計金額には含まれません。

          </div>

        </div>


        <div
          id="segmentFeeContainer"
          class="form-group full">
        </div>


        <!-- 交通費 -->

        <div class="form-group full">

          <label>
            交通費
          </label>

          <div class="money-input">

            <input
              type="number"
              id="transportCost"
              min="0"
              step="1"
              placeholder="0"
              required>

            <span>
              円
            </span>

          </div>

        </div>


        <!-- 合計 -->

        <div class="total-box">

          <span>
            合計金額
          </span>

          <strong>
            <span id="totalAmount">
              0
            </span>
            円
          </strong>

        </div>


        <div class="form-group full">

          <label>
            備考
          </label>

          <textarea
            id="note"
            rows="4"
            placeholder="必要事項があれば入力してください。">
          </textarea>

        </div>


        <div class="checkbox-area">

          <label>

            <input
              type="checkbox"
              id="confirm"
              required>

            <span>
              入力内容を確認しました
            </span>

          </label>

        </div>


      </div>


      <button
        type="submit"
        id="submitButton"
        class="primary-button">

        申請する

      </button>


    </form>

  </div>



  <!-- 自分の申請 -->

  <div class="card">

    <div class="section-header">

      <div>

        <p class="eyebrow">
          APPLICATIONS
        </p>

        <h2>
          自分の申請
        </h2>

      </div>

      <button
        id="refreshStudentButton"
        class="secondary-button">

        更新

      </button>

    </div>


    <div
      id="studentApplications"
      class="application-list">

      <p class="empty-message">
        申請履歴を読み込んでいます…
      </p>

    </div>

  </div>

</section>



<!-- ==================================================
     教員画面
================================================== -->

<section
  id="teacherScreen"
  class="screen hidden">


  <div class="dashboard-header">

    <div>

      <p class="eyebrow">
        TEACHER
      </p>

      <h1>
        管理画面
      </h1>

      <p id="teacherName"></p>

    </div>

  </div>


  <!-- タブ -->

  <div class="admin-tabs">

    <button
      class="admin-tab active"
      data-tab="applicationsTab">

      📋 申請管理

    </button>


    <button
      class="admin-tab"
      data-tab="studentsTab">

      👥 生徒管理

    </button>

  </div>



  <!-- ==================================================
       申請管理
  ================================================== -->

  <div
    id="applicationsTab"
    class="admin-tab-content">


    <div class="card">

      <div class="section-header">

        <div>

          <p class="eyebrow">
            APPLICATIONS
          </p>

          <h2>
            交通費申請一覧
          </h2>

        </div>

        <button
          id="refreshTeacherButton"
          class="secondary-button">

          更新

        </button>

      </div>


      <div
        id="teacherApplications"
        class="teacher-applications">

        <p class="empty-message">
          読み込んでいます…
        </p>

      </div>

    </div>

  </div>



  <!-- ==================================================
       生徒管理
  ================================================== -->

  <div
    id="studentsTab"
    class="admin-tab-content hidden">


    <div class="card">

      <div class="section-header">

        <div>

          <p class="eyebrow">
            STUDENTS
          </p>

          <h2>
            生徒管理
          </h2>

        </div>


        <button
          id="addStudentButton"
          class="primary-button small">

          ＋ 生徒を追加

        </button>

      </div>


      <div
        id="studentManagement"
        class="student-management">

        <p class="empty-message">
          生徒一覧を読み込んでいます…
        </p>

      </div>

    </div>

  </div>

</section>



<!-- ==================================================
     成功画面
================================================== -->

<section
  id="successScreen"
  class="screen hidden">

  <div class="card success-card">

    <div class="success-icon">
      ✓
    </div>

    <h1>
      申請完了
    </h1>

    <p>
      交通費申請を受け付けました。
    </p>


    <div class="application-number">

      <span>
        申請番号
      </span>

      <strong id="applicationNumber">
      </strong>

    </div>


    <button
      id="newApplication"
      class="primary-button">

      新しい申請をする

    </button>

  </div>

</section>


</main>


<!-- ==================================================
     生徒編集モーダル
================================================== -->

<div
  id="studentModal"
  class="modal hidden">

  <div class="modal-overlay"></div>

  <div class="modal-card">

    <button
      id="closeStudentModal"
      class="modal-close">
      ×
    </button>

    <h2 id="studentModalTitle">
      生徒を追加
    </h2>


    <form id="studentForm">

      <input
        type="hidden"
        id="editingStudentId">


      <div class="form-group">

        <label>
          ID
        </label>

        <input
          type="text"
          id="studentId"
          required>

      </div>


      <div class="form-group">

        <label>
          氏名
        </label>

        <input
          type="text"
          id="studentEditName"
          required>

      </div>


      <div class="form-group">

        <label>
          学年
        </label>

        <select
          id="studentEditGrade"
          required>

          <option value="">
            選択してください
          </option>

          <option value="1年">1年</option>
          <option value="2年">2年</option>
          <option value="3年">3年</option>

        </select>

      </div>


      <button
        type="submit"
        class="primary-button">

        保存

      </button>

    </form>

  </div>

</div>


<script src="script.js"></script>

</body>

</html>
