<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>交通費申請システム</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<!-- ==================================================
     ヘッダー
================================================== -->

<header class="header">

  <div class="header-inner">

    <div>

      <p class="header-label">
        ESPORTS CLUB
      </p>

      <h1>
        交通費申請システム
      </h1>

    </div>

    <button
      id="logoutButton"
      class="logout-button hidden"
    >
      ログアウト
    </button>

  </div>

</header>



<main class="container">


<!-- ==================================================
     ログイン画面
================================================== -->

<section
  id="loginScreen"
  class="card login-card"
>

  <div class="login-icon">
    🎮
  </div>

  <h2>
    ログイン
  </h2>

  <p class="description">
    学校から指定されたIDを入力してください。
  </p>


  <form id="loginForm">

    <div class="form-group">

      <label for="loginId">
        ID
      </label>

      <input
        type="text"
        id="loginId"
        placeholder="例：student001"
        autocomplete="off"
        required
      >

    </div>


    <button
      type="submit"
      class="primary-button"
    >
      ログイン
    </button>

  </form>


  <p
    id="loginMessage"
    class="message"
  ></p>

</section>



<!-- ==================================================
     生徒画面
================================================== -->

<section
  id="studentScreen"
  class="hidden"
>


  <div class="welcome-card">

    <div>

      <p class="small-label">
        STUDENT
      </p>

      <h2>
        <span id="studentName"></span> さん
      </h2>

      <p>
        自分の交通費申請を確認できます。
      </p>

    </div>

  </div>



  <!-- 申請フォーム -->

  <section class="card">

    <div class="section-title">

      <div>

        <p class="small-label">
          APPLICATION
        </p>

        <h2>
          交通費を申請する
        </h2>

      </div>

    </div>


    <form id="expenseForm">


      <div class="form-grid">


        <!-- 氏名 -->

        <div class="form-group">

          <label>
            氏名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="name"
            required
          >

        </div>



        <!-- 学年 -->

        <div class="form-group">

          <label>
            学年
            <span class="required">必須</span>
          </label>

          <select
            id="grade"
            required
          >

            <option value="">
              学年を選択してください
            </option>

            <option value="1年">
              1年
            </option>

            <option value="2年">
              2年
            </option>

            <option value="3年">
              3年
            </option>

          </select>

        </div>



        <!-- クラス -->

        <div class="form-group">

          <label>
            クラス
            <span class="required">必須</span>
          </label>

          <select
            id="className"
            required
          >

            <option value="">
              クラスを選択してください
            </option>

            <option value="1組">
              1組
            </option>

            <option value="2組">
              2組
            </option>

            <option value="3組">
              3組
            </option>

            <option value="4組">
              4組
            </option>

            <option value="5組">
              5組
            </option>

          </select>

        </div>



        <!-- 遠征日 -->

        <div class="form-group">

          <label>
            遠征日
            <span class="required">必須</span>
          </label>

          <input
            type="date"
            id="tripDate"
            required
          >

        </div>



        <!-- 遠征先 -->

        <div class="form-group">

          <label>
            遠征先
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="destination"
            placeholder="例：大阪"
            required
          >

        </div>



        <!-- 大会 -->

        <div class="form-group">

          <label>
            大会・イベント名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="eventName"
            required
          >

        </div>



        <!-- 出発地 -->

        <div class="form-group">

          <label>
            出発地
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="departure"
            required
          >

        </div>



        <!-- 到着地 -->

        <div class="form-group">

          <label>
            到着地
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="arrival"
            required
          >

        </div>



        <!-- 交通費 -->

        <div class="form-group">

          <label>
            交通費
            <span class="required">必須</span>
          </label>

          <div class="money-input">

            <input
              type="number"
              id="transportCost"
              min="0"
              step="1"
              placeholder="0"
              required
            >

            <span>円</span>

          </div>

        </div>


      </div>


      <!-- 合計 -->

      <div class="total-box">

        <span>
          合計金額
        </span>

        <strong>
          ¥<span id="totalAmount">
            0
          </span>
        </strong>

      </div>



      <!-- 備考 -->

      <div class="form-group">

        <label>
          備考
        </label>

        <textarea
          id="note"
          rows="4"
          placeholder="必要事項があれば入力してください"
        ></textarea>

      </div>



      <!-- 確認 -->

      <label class="confirm-box">

        <input
          type="checkbox"
          id="confirm"
          required
        >

        <span>
          入力内容を確認しました。
        </span>

      </label>



      <button
        type="submit"
        id="submitButton"
        class="primary-button"
      >
        交通費を申請する
      </button>


    </form>

  </section>



  <!-- 自分の申請 -->

  <section class="card">

    <div class="section-title">

      <div>

        <p class="small-label">
          MY APPLICATIONS
        </p>

        <h2>
          申請状況
        </h2>

      </div>

      <button
        id="refreshStudentButton"
        class="secondary-button"
      >
        更新
      </button>

    </div>


    <div id="studentApplications">

      <div class="loading">
        読み込み中...
      </div>

    </div>

  </section>

</section>



<!-- ==================================================
     教員画面
================================================== -->

<section
  id="teacherScreen"
  class="hidden"
>


  <div class="welcome-card teacher">

    <div>

      <p class="small-label">
        TEACHER
      </p>

      <h2>
        教員管理画面
      </h2>

      <p>
        交通費申請の確認・ステータス変更ができます。
      </p>

    </div>

  </div>



  <section class="card">

    <div class="section-title">

      <div>

        <p class="small-label">
          APPLICATIONS
        </p>

        <h2>
          申請一覧
        </h2>

      </div>

      <button
        id="refreshTeacherButton"
        class="secondary-button"
      >
        更新
      </button>

    </div>


    <div id="teacherApplications">

      <div class="loading">
        読み込み中...
      </div>

    </div>

  </section>

</section>



<!-- ==================================================
     成功画面
================================================== -->

<section
  id="successScreen"
  class="card success-screen hidden"
>

  <div class="success-icon">
    ✓
  </div>

  <h2>
    申請完了
  </h2>

  <p>
    交通費申請を受け付けました。
  </p>


  <div class="application-number">

    <span>
      申請番号
    </span>

    <strong id="applicationNumber">
    </strong>

  </div>


  <button
    id="backToDashboard"
    class="primary-button"
  >
    申請状況へ戻る
  </button>

</section>


</main>



<footer class="footer">

  <p>
    ESPORTS CLUB
  </p>

  <p>
    交通費申請システム
  </p>

</footer>


<script src="script.js"></script>

</body>

</html>
